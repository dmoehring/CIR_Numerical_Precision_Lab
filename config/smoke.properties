# Smoke test: seconds, no CSV.
experiment.label=smoke

cir.initialRate=0.03
cir.meanReversionSpeed=0.50
cir.longTermMean=0.04
cir.volatility=0.10
# STRICT (default) rejects 2*theta*mu < sigma^2; ALLOW_VIOLATION only for explicit robustness runs
cir.fellerMode=STRICT

bond.notional=100.00
bond.couponRate=0.04
bond.maturity=5.0
bond.couponFrequency=1

option.strike=100.00
option.exerciseDates=1.0,2.0,3.0,4.0

simulation.stepsPerYear=12
# Brownian coupling: fine normals per step (1 = none)
simulation.normalsPerStep=1
# training paths and seed
simulation.paths=200
simulation.seed=42
# independent valuation (out-of-sample) paths and seed
valuation.paths=200
valuation.seed=4242
simulation.threads=1

cluster.count=5
cluster.minPathsPerCluster=20
continuation.methods=QUANTILE_CLUSTER,LEAST_SQUARES
continuation.pathSelection=ALL
lsm.basisVariable=SHORT_RATE

decimal.precision=34
decimal.roundingMode=HALF_EVEN
decimal.guardDigits=10

diagnostics.tracePaths=20
control.kahan=true
output.dir=results
output.csv=false

# analytic zero bond evaluation form: LOG_DIFFERENCE (textbook) or LOG1P_RATIO (less cancellation)
zerobond.form=LOG_DIFFERENCE
